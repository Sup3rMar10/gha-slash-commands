name: commands

on:
  issue_comment:
    types: [created]

permissions: {}

jobs:
  command:
    # Only people with write-level standing can run commands, and only comments that start with "/".
    if: >-
      startsWith(github.event.comment.body, '/') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/github-script@v9
        env:
          COMMENT: ${{ github.event.comment.body }}      # untrusted text: via env, never inline
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comment_id = context.payload.comment.id;
            const [cmd, ...args] = process.env.COMMENT.trim().split(/\s+/);
            const react = (content) =>
              github.rest.reactions.createForIssueComment({ owner, repo, comment_id, content });
            const reply = (body) =>
              github.rest.issues.createComment({ owner, repo, issue_number, body });
            const ALLOWED = ['bug', 'docs', 'question', 'help-wanted'];   // an allow-list, not any label

            if (cmd === '/label') {
              const wanted = args.filter(a => ALLOWED.includes(a));
              if (wanted.length === 0) {
                await react('confused');
                await reply('No allowed label given. Allowed: ' + ALLOWED.join(', '));
              } else {
                await github.rest.issues.addLabels({ owner, repo, issue_number, labels: wanted });
                await react('+1');
              }
            } else if (cmd === '/assign-me') {
              await github.rest.issues.addAssignees({
                owner, repo, issue_number, assignees: [context.payload.comment.user.login],
              });
              await react('+1');
            } else if (cmd === '/help') {
              await reply('Commands: `/label <name>`, `/assign-me`, `/help`.');
            } else {
              await react('confused');
              await reply('Unknown command. Try `/help`.');
            }
